name: local_novel_reader
description: "一款轻量级本地小说阅读器：txt / epub，自动分章，离线无广告。"
publish_to: "none"

version: 1.1.0+2

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter

  file_picker: ^8.1.7
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.2
  path: ^1.9.0
  provider: ^6.1.1
  intl: ^0.20.1

  # epub 解析：zip + xml，不引入重量级依赖
  archive: ^3.6.1
  xml: ^6.5.0

  # 中文 txt 常见 GBK 编码
  gbk_codec: ^0.4.0

  # Material You 动态取色（Android 12+）
  dynamic_color: ^1.7.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.8

flutter:
  uses-material-design: true
